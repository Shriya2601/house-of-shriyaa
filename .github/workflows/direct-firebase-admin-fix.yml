name: Direct Firebase admin image fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin image uploads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/admin/AddProductModal.tsx')
          s = p.read_text()

          if 'getDownloadURL' not in s:
              s = s.replace(
                  'import { saveProduct } from "../../services/storeService";',
                  'import { saveProduct } from "../../services/storeService";\nimport { storage } from "../../lib/firebase";\nimport { getDownloadURL, ref as storageRef, uploadString } from "firebase/storage";'
              )

          helper = '''\nasync function uploadAdminImageToFirebase(dataUrl: string, productId: string, slot: string): Promise<string> {\n  if (!dataUrl || !dataUrl.startsWith("data:")) return dataUrl;\n  const mime = dataUrl.match(/^data:([^;]+);base64,/i)?.[1] || "image/jpeg";\n  const ext = mime.split("/")[1]?.replace("jpeg", "jpg") || "jpg";\n  const safeSlot = slot.replace(/[^a-zA-Z0-9_-]/g, "-");\n  const objectRef = storageRef(storage, `products/${productId}/${safeSlot}-${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`);\n  await uploadString(objectRef, dataUrl, "data_url", { contentType: mime, cacheControl: "public,max-age=31536000,immutable" });\n  return await getDownloadURL(objectRef);\n}\n\n'''
          if 'async function uploadAdminImageToFirebase' not in s:
              marker = 'export default function AddProductModal('
              s = s.replace(marker, helper + marker)

          # Main image selection: never use the Cloudflare /api/upload filesystem.
          old_main = '''      // Concurrently persist to server for permanent URL\n      try {\n        const uploadRes = await fetch("/api/upload", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ dataUrl, filename: file.name }),\n        });\n        if (uploadRes.ok) {\n          const uploadJson = await uploadRes.json();\n          if (uploadJson.url) {\n            setImage(uploadJson.url);\n            if (!hoverImage || hoverImage === dataUrl || hoverImage === image || (productToEdit && hoverImage === productToEdit.image)) {\n              setHoverImage(uploadJson.url);\n            }\n          }\n        }\n      } catch (uploadErr) {\n        console.warn("Direct upload fallback to dataUrl", uploadErr);\n      }'''
          new_main = '''      // Persist directly to Firebase Storage. Cloudflare server files are not durable.\n      try {\n        const permanentUrl = await uploadAdminImageToFirebase(dataUrl, productToEdit?.id || `hos-${Date.now()}`, "main");\n        setImage(permanentUrl);\n        if (!hoverImage || hoverImage === dataUrl || hoverImage === image || (productToEdit && hoverImage === productToEdit.image)) {\n          setHoverImage(permanentUrl);\n        }\n      } catch (uploadErr: any) {\n        console.error("Firebase main image upload failed", uploadErr);\n        setError(uploadErr?.message || "Could not save the photo to Firebase Storage.");\n      }'''
          if old_main in s:
              s = s.replace(old_main, new_main, 1)

          old_hover = '''      try {\n        const uploadRes = await fetch("/api/upload", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ dataUrl, filename: file.name }),\n        });\n        if (uploadRes.ok) {\n          const uploadJson = await uploadRes.json();\n          if (uploadJson.url) {\n            setHoverImage(uploadJson.url);\n          }\n        }\n      } catch (uploadErr) {\n        console.warn("Direct hover upload fallback to dataUrl", uploadErr);\n      }'''
          new_hover = '''      try {\n        const permanentUrl = await uploadAdminImageToFirebase(dataUrl, productToEdit?.id || `hos-${Date.now()}`, "hover");\n        setHoverImage(permanentUrl);\n      } catch (uploadErr: any) {\n        console.error("Firebase hover image upload failed", uploadErr);\n        setError(uploadErr?.message || "Could not save the hover photo to Firebase Storage.");\n      }'''
          if old_hover in s:
              s = s.replace(old_hover, new_hover, 1)

          old_extra = '''      let finalUrl = dataUrl;\n      try {\n        const uploadRes = await fetch("/api/upload", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ dataUrl, filename: file.name }),\n        });\n        if (uploadRes.ok) {\n          const uploadJson = await uploadRes.json();\n          if (uploadJson.url) {\n            finalUrl = uploadJson.url;\n          }\n        }\n      } catch (uploadErr) {\n        console.warn("Gallery upload fallback to dataUrl", uploadErr);\n      }'''
          new_extra = '''      let finalUrl = dataUrl;\n      try {\n        finalUrl = await uploadAdminImageToFirebase(dataUrl, productToEdit?.id || `hos-${Date.now()}`, `gallery-${Date.now()}`);\n      } catch (uploadErr: any) {\n        console.error("Firebase gallery image upload failed", uploadErr);\n        setError(uploadErr?.message || "Could not save the gallery photo to Firebase Storage.");\n        return;\n      }'''
          if old_extra in s:
              s = s.replace(old_extra, new_extra, 1)

          # Submit fallback: any remaining data URL is uploaded to Firebase, never /api/upload.
          pattern_main = re.compile(r'''    // If images are still raw data URLs, attempt saving to /api/upload as well\n    let finalMainImg = image\.trim\(\);\n    if \(finalMainImg\.startsWith\("data:"\)\) \{.*?    \}\n\n    let finalHoverImage = hoverImage\.trim\(\) \|\| finalMainImg;''', re.S)
          repl_main = '''    // Any remaining raw data URL is made permanent in Firebase Storage before Firestore save.\n    let finalMainImg = image.trim();\n    if (finalMainImg.startsWith("data:")) {\n      finalMainImg = await uploadAdminImageToFirebase(finalMainImg, prodId, "main-fallback");\n    }\n\n    let finalHoverImage = hoverImage.trim() || finalMainImg;'''
          s, n = pattern_main.subn(repl_main, s, count=1)
          if n != 1:
              raise SystemExit('main submit block not found')

          pattern_hover = re.compile(r'''    if \(finalHoverImage\.startsWith\("data:"\)\) \{.*?    \}\n\n    const resolvedExtraImages: string\[\] = \[\];''', re.S)
          repl_hover = '''    if (finalHoverImage.startsWith("data:")) {\n      finalHoverImage = await uploadAdminImageToFirebase(finalHoverImage, prodId, "hover-fallback");\n    }\n\n    const resolvedExtraImages: string[] = [];'''
          s, n = pattern_hover.subn(repl_hover, s, count=1)
          if n != 1:
              raise SystemExit('hover submit block not found')

          pattern_extra = re.compile(r'''    for \(let i = 0; i < extraImages\.length; i\+\+\) \{.*?      resolvedExtraImages\.push\(extraImg\);\n    \}''', re.S)
          repl_extra = '''    for (let i = 0; i < extraImages.length; i++) {\n      let extraImg = extraImages[i];\n      if (extraImg.startsWith("data:")) {\n        extraImg = await uploadAdminImageToFirebase(extraImg, prodId, `gallery-fallback-${i}`);\n      }\n      resolvedExtraImages.push(extraImg);\n    }'''
          s, n = pattern_extra.subn(repl_extra, s, count=1)
          if n != 1:
              raise SystemExit('gallery submit block not found')

          p.write_text(s)

          # Remove obsolete server upload API usage from this admin component.
          if '/api/upload' in s:
              raise SystemExit('Admin component still contains /api/upload after patch')

          print('Admin Firebase Storage upload patch complete.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AddProductModal.tsx
          git diff --cached --quiet && echo "No admin changes needed" && exit 0
          git commit -m "fix: persist admin product images in Firebase Storage"
          git push
