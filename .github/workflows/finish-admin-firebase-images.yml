name: Finish admin Firebase image persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: disable legacy admin image upload') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove durable dependency on Cloudflare server filesystem
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/admin/AddProductModal.tsx')
          s = p.read_text()

          # Keep the existing preview/data-URL flow. storeService now uploads data URLs to
          # Firebase Storage before Firestore persistence, so the old /api/upload endpoint
          # must not replace them with non-durable /uploads/... paths.
          old = 'fetch("/api/upload"'
          count = s.count(old)
          if count == 0:
              raise SystemExit('No legacy /api/upload calls found in AddProductModal.tsx')
          s = s.replace(old, 'fetch("/api/upload-disabled"')
          p.write_text(s)
          print(f'Disabled {count} legacy admin image upload calls; Firebase Storage now owns persistence.')

      - name: Commit admin upload fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AddProductModal.tsx
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: disable legacy admin image upload"
          git push
