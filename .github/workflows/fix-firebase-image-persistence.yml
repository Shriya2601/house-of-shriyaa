name: Fix Firebase image persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: Firebase image persistence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch image persistence to use Firebase Storage + Firestore
        shell: python
        run: |
          from pathlib import Path
          import re

          # firebase.ts: expose Firebase Storage
          p = Path('src/lib/firebase.ts')
          s = p.read_text()
          s = s.replace('import { getFirestore } from "firebase/firestore";', 'import { getFirestore } from "firebase/firestore";\nimport { getStorage } from "firebase/storage";')
          marker = 'export const auth = getAuth(app);\n'
          if 'export const storage = getStorage(app);' not in s:
              s = s.replace(marker, marker + '\n// Firebase Storage is the permanent home for admin-uploaded product photos.\nexport const storage = getStorage(app);\n')
          p.write_text(s)

          # storeService.ts: add Storage imports
          p = Path('src/services/storeService.ts')
          s = p.read_text()
          if 'from "firebase/storage"' not in s:
              needle = 'import { db, auth } from "../lib/firebase";'
              s = s.replace(needle, needle + '\nimport { storage } from "../lib/firebase";\nimport { getDownloadURL, ref as storageRef, uploadString } from "firebase/storage";')

          # Add robust data-URL -> Firebase Storage migration helper.
          helper_marker = '// Helper to normalize uploaded image paths cleanly\n'
          if 'async function persistProductImagesToFirebase' not in s:
              helper = r'''// Upload any pending local data-URL product photos to Firebase Storage before the product is saved.
// This is intentionally client-side so it works on Cloudflare without relying on a writable server filesystem.
async function uploadProductDataUrlToFirebase(dataUrl: string, productId: string, slot: string): Promise<string> {
  if (!dataUrl || !dataUrl.startsWith("data:")) return dataUrl;
  const mimeMatch = dataUrl.match(/^data:([^;]+);base64,/i);
  const mime = mimeMatch?.[1] || "image/jpeg";
  const extension = mime.split("/")[1]?.replace("jpeg", "jpg") || "jpg";
  const safeSlot = slot.replace(/[^a-zA-Z0-9_-]/g, "-");
  const randomPart = typeof crypto !== "undefined" && "randomUUID" in crypto
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.floor(Math.random() * 100000)}`;
  const objectPath = `products/${productId}/${safeSlot}-${randomPart}.${extension}`;
  const objectRef = storageRef(storage, objectPath);
  await uploadString(objectRef, dataUrl, "data_url", {
    contentType: mime,
    cacheControl: "public,max-age=31536000,immutable",
  });
  return await getDownloadURL(objectRef);
}

async function persistProductImagesToFirebase(product: Partial<Product> & { id?: string }, productId: string): Promise<Product> {
  const result: any = { ...product, id: productId };
  if (result.image?.startsWith?.("data:")) {
    result.image = await uploadProductDataUrlToFirebase(result.image, productId, "main");
  }
  if (result.hoverImage?.startsWith?.("data:")) {
    result.hoverImage = await uploadProductDataUrlToFirebase(result.hoverImage, productId, "hover");
  }
  if (Array.isArray(result.images)) {
    result.images = await Promise.all(result.images.map((img: string, index: number) =>
      img?.startsWith?.("data:") ? uploadProductDataUrlToFirebase(img, productId, `gallery-${index + 1}`) : img
    ));
  }
  if (Array.isArray(result.colorVariants)) {
    result.colorVariants = await Promise.all(result.colorVariants.map(async (variant: any, index: number) => {
      const v = { ...variant };
      if (v.image?.startsWith?.("data:")) {
        v.image = await uploadProductDataUrlToFirebase(v.image, productId, `variant-${index + 1}-main`);
      }
      if (v.hoverImage?.startsWith?.("data:")) {
        v.hoverImage = await uploadProductDataUrlToFirebase(v.hoverImage, productId, `variant-${index + 1}-hover`);
      }
      if (Array.isArray(v.images)) {
        v.images = await Promise.all(v.images.map((img: string, imageIndex: number) =>
          img?.startsWith?.("data:") ? uploadProductDataUrlToFirebase(img, productId, `variant-${index + 1}-${imageIndex + 1}`) : img
        ));
      }
      return v;
    }));
  }
  return result as Product;
}

'''
              s = s.replace(helper_marker, helper + helper_marker)

          # saveProduct: migrate data-URLs to Firebase Storage BEFORE any cache/API/Firestore persistence.
          old = '''  // Apply cache-busting timestamp to /uploads/ URLs to ensure Cloudflare / browsers never serve stale cached images\n  const cleanImage = applyImageCacheBuster(product.image);'''
          new = '''  // Firebase Storage is authoritative for newly selected device photos.\n  // Do this before local cache/API/Firestore writes so a failed Cloudflare filesystem upload can never leave a data URL or stale image behind.\n  const firebaseProduct = await persistProductImagesToFirebase(product, id);\n  product = firebaseProduct;\n\n  // Apply cache-busting timestamp to legacy /uploads/ URLs while preserving permanent Firebase URLs.\n  const cleanImage = applyImageCacheBuster(product.image);'''
          if old not in s:
              raise SystemExit('Expected saveProduct image block was not found')
          s = s.replace(old, new, 1)

          # Make Firestore product persistence blocking + verified instead of a fire-and-forget 2.5s race.
          old_fs = '''  // 3. Sync to Firestore in the background with timeout guard so UI is never blocked\n  Promise.race([\n    (async () => {\n      const docRef = doc(db, "products", id);\n      await setDoc(docRef, sanitizeForFirestore(sanitized), { merge: true });\n    })(),\n    new Promise((_, reject) => setTimeout(() => reject(new Error("Firestore sync timeout")), 2500)),\n  ]).catch((fsErr) => {\n    console.warn("Firestore product setDoc notice:", fsErr);\n  });\n\n  return { id, success: true, product: sanitized };'''
          new_fs = '''  // 3. Firestore is the permanent product-data source of truth. Wait for the write and verify it.\n  const docRef = doc(db, "products", id);\n  await setDoc(docRef, sanitizeForFirestore(sanitized), { merge: true });\n  const verifySnap = await getDoc(docRef);\n  if (!verifySnap.exists()) {\n    throw new Error("Product save could not be verified in Firebase. Please try again.");\n  }\n\n  return { id, success: true, product: sanitized };'''
          if old_fs not in s:
              raise SystemExit('Expected Firestore save block was not found')
          s = s.replace(old_fs, new_fs, 1)

          # Product reads: stop the old static JSON fallback from overwriting Firebase data on Cloudflare.
          start = s.find('  // Active sync function: fetches from central backend API with anti-cache headers\n  const fetchLiveProducts = async () => {')
          end = s.find('  // 1. Initial live fetch immediately\n', start)
          if start == -1 or end == -1:
              raise SystemExit('subscribeProducts fetchLiveProducts block was not found')
          replacement = '''  // Firebase Firestore is the authoritative product source.\n  // Do not fall back to the old bundled JSON catalog, because that would resurrect old photos on Cloudflare.\n  const fetchLiveProducts = async () => {\n    if (!active) return;\n    try {\n      const colRef = collection(db, "products");\n      const snap = await getDocs(colRef);\n      if (!snap.empty) {\n        const deleted = getLocallyDeletedIds("products");\n        const fsList = snap.docs\n          .map((d) => ensureProductVariants({ id: d.id, ...d.data() }))\n          .filter((p) => p && p.id && !deleted.has(p.id) && !deleted.has((p as any).sku));\n        cacheProductsLocally(fsList);\n        callback(fsList);\n      }\n    } catch (err) {\n      console.warn("[Firestore] Product refresh notice:", err);\n    }\n  };\n\n'''
          s = s[:start] + replacement + s[end:]

          # Firestore snapshot must be authoritative; never let an older local timestamp win over the cloud copy.
          old_merge = '''          if (fsList.length > 0) {\n            const current = getCachedProducts().filter((p) => p && !deleted.has(p.id) && !deleted.has((p as any).sku));\n            const merged = mergeEntitiesByTimestamp(current, fsList, deleted, (p) => p.id, (p) => (p as any).sku);\n            cacheProductsLocally(merged);\n            callback(merged);\n\n            // Dispatch global event for instant in-tab & across-component synchronization\n            if (typeof window !== "undefined") {\n              window.dispatchEvent(new CustomEvent("hos-catalog-updated", { detail: merged }));\n            }\n          }'''
          new_merge = '''          if (fsList.length > 0) {\n            // Firestore is authoritative. Replace stale local catalog data instead of timestamp-merging it back in.\n            cacheProductsLocally(fsList);\n            callback(fsList);\n\n            if (typeof window !== "undefined") {\n              window.dispatchEvent(new CustomEvent("hos-catalog-updated", { detail: fsList }));\n            }\n          }'''
          if old_merge not in s:
              raise SystemExit('Expected Firestore product merge block was not found')
          s = s.replace(old_merge, new_merge, 1)

          p.write_text(s)

          print('Firebase image persistence repair patch applied successfully.')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/firebase.ts src/services/storeService.ts
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: Firebase image persistence"
          git push
