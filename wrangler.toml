name = "house-of-shriya"
compatibility_date = "2026-09-17"
main = "./dist/worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/uploads/*"]

# Production Cloudflare R2 bucket used by the admin image upload API
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "house-of-shriya-images"
